x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://ec2opt:ec2opt@db:5432/ec2opt
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ec2opt, POSTGRES_PASSWORD: ec2opt, POSTGRES_DB: ec2opt }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ec2opt"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
  api:
    <<: *backend
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    depends_on: [api]
  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on: [api]
  web:
    build: ./frontend
    environment: { API_PROXY_TARGET: "http://api:8000" }
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
